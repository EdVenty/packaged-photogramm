[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pgtui"
version = "0.1.0"
description = "Terminal UI for the packaged-photogramm reconstruction server"
requires-python = ">=3.10"
dependencies = ["textual>=0.80", "httpx>=0.27"]

[project.scripts]
pgtui = "pgtui.app:main"

[tool.setuptools]
packages = ["pgtui"]
